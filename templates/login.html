{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
  <div class="hidden lg:block">
    <div class="rounded-2xl overflow-hidden shadow-lg">
      <img
        src="{{ url_for('static', filename='/Users/darshan/Downloads/cervix-app 2/static/img/WhatsApp Image 2025-10-12 at 20.20.46 copy.jpeg') }}"
        alt="Microscope"
        class="w-full h-[520px] object-cover">
    </div>
  </div>

  <div>
    <div class="glass rounded-2xl shadow-xl p-8">
      <h1 class="text-3xl font-semibold tracking-tight text-gray-900 mb-2">Welcome back</h1>
      <p class="text-gray-600 mb-6">Sign in to upload cases and review AI results.</p>

      <form method="POST" class="space-y-5">
        <div>
          <label class="label">Email</label>
          <input name="email" type="email" required class="input" placeholder="you@lab.org" />
        </div>
        <div>
          <label class="label">Password</label>
          <input name="password" type="password" required class="input" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary w-full justify-center">Login</button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Don’t have an account?
        <a href="{{ url_for('register') }}" class="text-indigo-600 hover:underline">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
